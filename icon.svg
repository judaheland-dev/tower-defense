<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e2d4a"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </radialGradient>
    <linearGradient id="stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8899aa"/>
      <stop offset="100%" stop-color="#445566"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#c87a00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="30" cy="28" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="80" cy="18" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="150" cy="22" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="210" cy="35" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="230" cy="16" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="195" cy="55" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="20" cy="60" r="1" fill="#ffffff" opacity="0.4"/>

  <!-- Ground / horizon -->
  <ellipse cx="128" cy="210" rx="100" ry="18" fill="#0d1a2e" opacity="0.7"/>

  <!-- Tower base -->
  <rect x="88" y="150" width="80" height="60" fill="url(#stone)" rx="2"/>
  <!-- Tower gate arch -->
  <rect x="112" y="172" width="32" height="38" fill="#0a0e17" rx="4"/>
  <!-- Gate portcullis bars -->
  <line x1="117" y1="172" x2="117" y2="210" stroke="#223" stroke-width="2" opacity="0.7"/>
  <line x1="125" y1="172" x2="125" y2="210" stroke="#223" stroke-width="2" opacity="0.7"/>
  <line x1="133" y1="172" x2="133" y2="210" stroke="#223" stroke-width="2" opacity="0.7"/>
  <line x1="141" y1="172" x2="141" y2="210" stroke="#223" stroke-width="2" opacity="0.7"/>
  <line x1="112" y1="184" x2="144" y2="184" stroke="#223" stroke-width="2" opacity="0.7"/>
  <line x1="112" y1="196" x2="144" y2="196" stroke="#223" stroke-width="2" opacity="0.7"/>
  <!-- Tower corner stones -->
  <rect x="88" y="150" width="14" height="10" fill="#6a7d8e" opacity="0.5"/>
  <rect x="154" y="150" width="14" height="10" fill="#6a7d8e" opacity="0.5"/>
  <rect x="88" y="170" width="14" height="10" fill="#6a7d8e" opacity="0.5"/>
  <rect x="154" y="170" width="14" height="10" fill="#6a7d8e" opacity="0.5"/>
  <rect x="88" y="190" width="14" height="10" fill="#6a7d8e" opacity="0.5"/>
  <rect x="154" y="190" width="14" height="10" fill="#6a7d8e" opacity="0.5"/>

  <!-- Tower top / parapet -->
  <rect x="82" y="130" width="92" height="26" fill="url(#stone)" rx="2"/>
  <!-- Merlons (battlements) -->
  <rect x="82" y="116" width="18" height="18" fill="url(#stone)" rx="2"/>
  <rect x="110" y="116" width="18" height="18" fill="url(#stone)" rx="2"/>
  <rect x="138" y="116" width="18" height="18" fill="url(#stone)" rx="2"/>
  <rect x="156" y="116" width="18" height="18" fill="url(#stone)" rx="2"/>
  <!-- Parapet stone details -->
  <rect x="82" y="130" width="18" height="8" fill="#6a7d8e" opacity="0.4"/>
  <rect x="110" y="130" width="18" height="8" fill="#6a7d8e" opacity="0.4"/>
  <rect x="138" y="130" width="18" height="8" fill="#6a7d8e" opacity="0.4"/>

  <!-- Side turrets -->
  <rect x="58" y="148" width="36" height="42" fill="url(#stone)" rx="2"/>
  <rect x="162" y="148" width="36" height="42" fill="url(#stone)" rx="2"/>
  <!-- Turret tops -->
  <rect x="54" y="132" width="44" height="20" fill="url(#stone)" rx="2"/>
  <rect x="158" y="132" width="44" height="20" fill="url(#stone)" rx="2"/>
  <!-- Turret merlons -->
  <rect x="54" y="120" width="12" height="16" fill="url(#stone)" rx="1"/>
  <rect x="72" y="120" width="12" height="16" fill="url(#stone)" rx="1"/>
  <rect x="90" y="120" width="8" height="16" fill="url(#stone)" rx="1"/>
  <rect x="158" y="120" width="8" height="16" fill="url(#stone)" rx="1"/>
  <rect x="172" y="120" width="12" height="16" fill="url(#stone)" rx="1"/>
  <rect x="190" y="120" width="12" height="16" fill="url(#stone)" rx="1"/>

  <!-- Flag pole -->
  <line x1="128" y1="66" x2="128" y2="116" stroke="#c8a060" stroke-width="3"/>
  <!-- Flag -->
  <polygon points="128,68 160,78 128,88" fill="#cc3333" filter="url(#glow)"/>
  <polygon points="128,68 128,88 126,78" fill="#aa2222"/>

  <!-- Crossed swords overlay (small, bottom corners) -->
  <!-- Left sword -->
  <g transform="translate(42,195) rotate(-40)">
    <rect x="-2" y="-28" width="4" height="44" rx="1" fill="url(#gold)"/>
    <rect x="-8" y="10" width="16" height="4" rx="1" fill="#aabbcc"/>
    <ellipse cx="0" cy="-30" rx="4" ry="5" fill="#aabbcc"/>
  </g>
  <!-- Right sword -->
  <g transform="translate(214,195) rotate(40)">
    <rect x="-2" y="-28" width="4" height="44" rx="1" fill="url(#gold)"/>
    <rect x="-8" y="10" width="16" height="4" rx="1" fill="#aabbcc"/>
    <ellipse cx="0" cy="-30" rx="4" ry="5" fill="#aabbcc"/>
  </g>

  <!-- "VS" badge in center bottom -->
  <ellipse cx="128" cy="222" rx="26" ry="14" fill="#1a1020" stroke="#ffd040" stroke-width="2"/>
  <text x="128" y="227" font-size="14" font-weight="bold" text-anchor="middle"
        fill="#ffd040" font-family="serif" letter-spacing="2">VS</text>

  <!-- Outer glow ring -->
  <rect width="256" height="256" rx="32" fill="none" stroke="#ffd040" stroke-width="2" opacity="0.25"/>
</svg>
